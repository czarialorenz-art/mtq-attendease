<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>MTQ-ATTENDEASE — QR Attendance & Assessment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --teal-900: #0B3230;
      --teal-800: #0E3E3B;
      --teal-700: #134B47;
      --teal-600: #1D7874;
      --teal-400: #3FB6AC;
      --teal-200: #BFE7E2;
      --teal-100: #EAF7F5;
      --gold-500: #D9A441;
      --gold-600: #C08B2C;
      --ink-900: #0F2523;
      --ink-700: #3A5652;
      --ink-400: #7C948F;
      --bg: #F5F9F8;
      --white: #ffffff;
      --danger: #C24C4C;
      --danger-bg: #FBEAEA;
      --ok: #2E8B57;
      --ok-bg: #E8F6EE;
      --warn: #B8860B;
      --warn-bg: #FBF3DE;
      --radius: 14px;
      --shadow: 0 6px 24px rgba(11, 50, 48, 0.10);
      --font-head: 'Fraunces', serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink-900);
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
    }

    h1,
    h2,
    h3,
    .headfont {
      font-family: var(--font-head);
      font-weight: 600;
      color: var(--teal-900);
      margin: 0;
    }

    button {
      font-family: var(--font-body);
      cursor: pointer;
    }

    input,
    select,
    textarea {
      font-family: var(--font-body);
    }

    a {
      color: inherit;
    }

    #app {
      min-height: 100vh;
    }

    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, var(--teal-700), var(--teal-900) 70%);
      padding: 20px;
    }

    .auth-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 36px 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand .mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--teal-600), var(--teal-400));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 18px;
    }

    .brand .name {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 700;
      color: var(--teal-900);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-700);
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #DDEAE8;
      border-radius: 10px;
      font-size: 14.5px;
      background: #FBFDFD;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--teal-400);
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--teal-600);
      font-size: 12.5px;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 14.5px;
      transition: transform .08s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: var(--teal-700);
      color: #fff;
      width: 100%;
      padding: 13px;
    }

    .btn-primary:hover {
      background: var(--teal-800);
    }

    .btn-gold {
      background: var(--gold-500);
      color: #3A2900;
    }

    .btn-gold:hover {
      background: var(--gold-600);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--teal-600);
      color: var(--teal-700);
    }

    .btn-outline:hover {
      background: var(--teal-100);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .btn-ghost {
      background: transparent;
      color: var(--teal-700);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 13px;
      border-radius: 8px;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--teal-600);
      font-weight: 600;
      font-size: 13.5px;
      padding: 0;
    }

    .msg {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .msg-err {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .msg-ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .switch-line {
      text-align: center;
      margin-top: 16px;
      font-size: 13.5px;
      color: var(--ink-700);
    }

    .pw-strength {
      height: 5px;
      border-radius: 4px;
      background: #E5EFED;
      margin-top: 6px;
      overflow: hidden;
    }

    .pw-strength i {
      display: block;
      height: 100%;
      transition: width .2s;
    }

    .hint {
      font-size: 11.5px;
      color: var(--ink-400);
      margin-top: 5px;
    }

    .shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 236px;
      background: linear-gradient(180deg, var(--teal-800), var(--teal-900));
      color: #EAF6F4;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
    }

    .sidebar .brand {
      color: #fff;
      padding: 0 6px;
      margin-bottom: 26px;
    }

    .sidebar .brand .name {
      color: #fff;
      font-size: 19px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #CFE9E5;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 3px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item .ic {
      width: 18px;
      text-align: center;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-weight: 600;
    }

    .sidebar-foot {
      margin-top: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 12px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 26px;
      background: var(--white);
      border-bottom: 1px solid #E7F0EE;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar .title {
      font-family: var(--font-head);
      font-size: 20px;
      color: var(--teal-900);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bell {
      position: relative;
      background: none;
      border: none;
      font-size: 19px;
      color: var(--teal-700);
    }

    .bell .dot {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--danger);
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--gold-500);
      color: #3A2900;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13.5px;
    }

    .content {
      padding: 22px 26px 90px;
      flex: 1;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      color: var(--teal-800);
    }

    .bottom-nav {
      display: none;
    }

    @media (max-width:880px) {
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        bottom: 0;
        z-index: 50;
        transition: left .2s;
        box-shadow: 0 0 30px rgba(0, 0, 0, .25);
      }

      .sidebar.open {
        left: 0;
      }

      .hamburger {
        display: inline-block;
      }

      .hide-mobile {
        display: none !important;
      }

      .content {
        padding: 16px 14px 90px;
      }

      .topbar {
        padding: 12px 14px;
      }

      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid #E7F0EE;
        z-index: 30;
        padding: 6px 2px;
        justify-content: space-around;
      }

      .bottom-nav button {
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 10px;
        color: var(--ink-400);
        padding: 5px 2px;
        flex: 1;
      }

      .bottom-nav button.active {
        color: var(--teal-700);
        font-weight: 700;
      }

      .bottom-nav .ic {
        font-size: 17px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .35);
        z-index: 40;
      }
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    @media(max-width:880px) {

      .grid-4,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width:520px) {

      .grid-4,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .stat .num {
      font-family: var(--font-head);
      font-size: 30px;
      color: var(--teal-800);
    }

    .stat .lbl {
      font-size: 12.5px;
      color: var(--ink-400);
      font-weight: 600;
      margin-top: 2px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .pill-ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .pill-warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .pill-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .pill-neutral {
      background: var(--teal-100);
      color: var(--teal-700);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    th {
      text-align: left;
      color: var(--ink-400);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: 8px 10px;
      border-bottom: 1.5px solid #EAF2F0;
    }

    td {
      padding: 10px 10px;
      border-bottom: 1px solid #F1F6F5;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-400);
    }

    .empty .big {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .class-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--teal-100);
      color: var(--teal-800);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      margin: 0 8px 8px 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .between {
      justify-content: space-between;
    }

    .wrap {
      flex-wrap: wrap;
    }

    #modalRoot {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #modalRoot.show {
      display: flex;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(11, 50, 48, 0.45);
    }

    .modal-box {
      position: relative;
      background: #fff;
      border-radius: 18px;
      max-width: 460px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      font-size: 18px;
      color: var(--ink-400);
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #qrCanvasHolder {
      background: #fff;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--teal-200);
    }

    .timer {
      font-family: var(--font-head);
      font-size: 38px;
      color: var(--teal-800);
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      max-height: 340px;
      object-fit: cover;
    }

    .scan-status {
      text-align: center;
      font-weight: 700;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .toast-wrap {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--teal-800);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      box-shadow: var(--shadow);
      min-width: 220px;
      animation: slidein .2s ease;
    }

    @keyframes slidein {
      from {
        transform: translateX(30px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast.err {
      background: var(--danger);
    }

    .toast.ok {
      background: var(--ok);
    }

    .notif-item {
      padding: 12px;
      border-radius: 10px;
      background: var(--teal-100);
      margin-bottom: 8px;
      font-size: 13.5px;
    }

    .thumb {
      height: 72px;
      width: 56px;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid #DDEAE8;
      cursor: zoom-in;
      background: #fff;
      vertical-align: middle;
    }

    .img-missing {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px dashed #D5E3E0;
      color: var(--ink-400);
      font-size: 12px;
      background: #FAFCFC;
    }

    .modal-box.modal-wide {
      max-width: min(960px, 96vw);
    }

    .viewer-stage {
      position: relative;
      height: 72vh;
      overflow: auto;
      border-radius: 10px;
      background: #1C2B2A;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-stage.zoomed {
      display: block;
      cursor: zoom-out;
    }

    .viewer-img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      transition: transform .15s ease;
    }

    .viewer-stage.zoomed .viewer-img {
      max-width: none;
      max-height: none;
      width: 200%;
      cursor: zoom-out;
    }

    .score-input {
      width: 92px;
      padding: 6px 8px;
      border: 1.5px solid #DDEAE8;
      border-radius: 8px;
    }

    table.report th, table.report td {
      white-space: nowrap;
      text-align: center;
    }

    table.report th:first-child, table.report td:first-child,
    table.report th:nth-child(2), table.report td:nth-child(2) {
      text-align: left;
    }

    table.report .sub {
      background: var(--teal-100);
      font-weight: 600;
    }

    table.report th.att-head {
      background: #FFF7E6;
    }

    table.report .att {
      background: #FFFBF2;
    }

    table.report td.att-absent {
      color: var(--danger);
      font-weight: 600;
    }

    table.report td.editable {
      cursor: pointer;
    }

    table.report td.editable:hover {
      background: #FFF7E6;
    }

    .captured-img {
      display: block;
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      max-height: 280px;
      object-fit: contain;
      background: #F5F9F8;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      border-bottom: 1.5px solid #EAF2F0;
      flex-wrap: wrap;
    }

    .tab {
      padding: 9px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-400);
      background: none;
      border: none;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px;
    }

    .tab.active {
      color: var(--teal-800);
      border-color: var(--teal-600);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-400);
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="modalRoot">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    /* ============================= API LAYER ============================= */

    const API_BASE = '/api';
    let TOKEN = localStorage.getItem('cs_token') || null;

    async function api(path, opts = {}) {
      const headers = { 'Accept': 'application/json', ...(opts.headers || {}) };
      if (opts.body && !(opts.body instanceof FormData)) { headers['Content-Type'] = 'application/json'; }
      if (TOKEN) { headers['Authorization'] = 'Bearer ' + TOKEN; }
      const res = await fetch(API_BASE + path, { ...opts, headers });
      let data = null;
      const text = await res.text();
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!res.ok) {
        const err = new Error((data && data.message) || 'Request failed');
        err.status = res.status; err.data = data;
        throw err;
      }
      return data;
    }
    function setToken(t) {
      TOKEN = t; if (t) localStorage.setItem('cs_token', t); else localStorage.removeItem('cs_token');
      if (typeof IMG_CACHE !== 'undefined') Object.keys(IMG_CACHE).forEach(k => { IMG_CACHE[k].then(u => URL.revokeObjectURL(u)).catch(() => { }); delete IMG_CACHE[k]; });
    }

    /* ============================= STATE / CACHE ============================= */
    let ST = { user: null, authView: 'login', authRole: 'student', page: 'dashboard', activeClassId: null, sidebarOpen: false, camStream: null, pendingCapture: null };
    let CACHE = { classes: [], notifications: [], myAttendance: [], myAssessments: [], classDetail: null };

    function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
    function toast(msg, type = '') {
      const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
      document.getElementById('toastWrap').appendChild(el);
      setTimeout(() => el.remove(), 3800);
    }
    function apiErrorToast(e) { toast((e && e.message) || 'Something went wrong.', 'err'); }
    function passwordPolicyText() { return '8–64 characters, with uppercase, lowercase, a number, and a special character.'; }
    function checkPasswordStrength(pw) {
      const checks = { len: pw.length >= 8 && pw.length <= 64, upper: /[A-Z]/.test(pw), lower: /[a-z]/.test(pw), num: /[0-9]/.test(pw), special: /[^A-Za-z0-9]/.test(pw) };
      return { ok: Object.values(checks).every(Boolean), score: Object.values(checks).filter(Boolean).length };
    }
    // Student choices (the server accepts only these values)
    const SECTIONS = ['A', 'B', 'C'];
    const COURSES = [['BSIT', 'BSIT (Information Technology)']];
    const YEAR_LEVELS = ['1st Year', '2nd Year', '3rd Year', '4th Year'];

    /** Dropdown of fixed choices; a saved value matching case-insensitively (e.g. "4th year") is preselected. */
    function choiceSelect(id, choices, current, placeholder) {
      const norm = v => String(v || '').trim().toLowerCase();
      const hit = choices.find(([v]) => norm(v) === norm(current));
      const cur = hit ? hit[0] : '';
      return `<select id="${id}" required>
        <option value="" ${cur ? '' : 'selected'} disabled>${placeholder}</option>
        ${choices.map(([v, l]) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    }
    const sectionSelect = (id, current = '') => choiceSelect(id, SECTIONS.map(s => [s, 'Section ' + s]), current, 'Choose section');
    const courseSelect = (id, current = '') => choiceSelect(id, COURSES, current, 'Choose course');
    const yearSelect = (id, current = '') => choiceSelect(id, YEAR_LEVELS.map(y => [y, y]), current, 'Choose year');
    /** Hint shown when an older free-typed value isn't one of the choices. */
    function legacyHint(saved, valid) {
      return saved && !valid.some(v => v.toLowerCase() === String(saved).trim().toLowerCase())
        ? `<div class="hint">Your saved value "${esc(saved)}" isn't in the list — please choose one.</div>` : '';
    }
    function classById(id) { return CACHE.classes.find(c => String(c.id) === String(id)); }

    /* ============================= SUBMITTED PHOTOS (served only to the signed-in teacher / owner) ============================= */
    const IMG_CACHE = {};
    function fetchAuthImage(url) {
      if (!IMG_CACHE[url]) {
        IMG_CACHE[url] = fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'image/*' } })
          .then(async res => {
            if (!res.ok) {
              let msg = res.status === 403 ? 'You cannot view this image.' : 'Image not available.';
              try { msg = (await res.json()).message || msg; } catch (e) { }
              throw new Error(msg);
            }
            return URL.createObjectURL(await res.blob());
          });
        IMG_CACHE[url].catch(() => { delete IMG_CACHE[url]; });
      }
      return IMG_CACHE[url];
    }
    /** Markup for a submission photo thumbnail; click opens the full-size viewer. */
    function authImg(url, caption = '', cls = 'thumb', style = '') {
      if (!url) return '<span class="img-missing">No photo</span>';
      return `<img data-auth-src="${esc(url)}" data-caption="${esc(caption)}" class="${cls}" style="${style}" alt="${esc(caption || 'Submitted photo')}" title="Click to enlarge" onclick="openImageViewer(this.dataset.authSrc, this.dataset.caption)">`;
    }
    function hydrateAuthImages(root = document) {
      root.querySelectorAll('img[data-auth-src]:not([data-loading])').forEach(img => {
        img.dataset.loading = '1';
        fetchAuthImage(img.dataset.authSrc)
          .then(src => { img.src = src; })
          .catch(err => {
            const span = document.createElement('span');
            span.className = 'img-missing'; span.textContent = err.message || 'Image not available.';
            img.replaceWith(span);
          });
      });
    }
    new MutationObserver(() => hydrateAuthImages()).observe(document.documentElement, { childList: true, subtree: true });

    let VIEWER = { rot: 0 };
    function openImageViewer(url, caption) {
      VIEWER = { rot: 0 };
      openModal(`<h3 style="margin-bottom:10px;padding-right:28px;">${esc(caption || 'Submitted photo')}</h3>
    <div id="viewerBody"><div class="loading" style="padding:30px;">Loading image…</div></div>`, true);
      fetchAuthImage(url)
        .then(src => {
          const b = document.getElementById('viewerBody'); if (!b) return;
          b.innerHTML = `<div class="viewer-stage" id="viewerStage" onclick="toggleViewerZoom(event)"><img src="${src}" id="viewerImg" class="viewer-img" alt="${esc(caption || 'Submitted photo')}"></div>
      <div class="row between wrap" style="gap:8px;margin-top:10px;">
        <div class="row" style="gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="rotateViewer(-90)">⟲ Rotate</button>
          <button class="btn btn-outline btn-sm" onclick="rotateViewer(90)">⟳ Rotate</button>
          <button class="btn btn-outline btn-sm" id="viewerZoomBtn" onclick="toggleViewerZoom()">🔍 Zoom in</button>
        </div>
        <a class="btn btn-outline btn-sm" href="${src}" target="_blank" rel="noopener">Open in new tab</a>
      </div>
      <div class="hint" style="margin-top:6px;">Click the picture to zoom; scroll to move around.</div>`;
        })
        .catch(err => { const b = document.getElementById('viewerBody'); if (b) b.innerHTML = `<div class="empty"><div class="big">🖼</div>${esc(err.message || 'Image not available.')}</div>`; });
    }
    function rotateViewer(deg) {
      const img = document.getElementById('viewerImg'), stage = document.getElementById('viewerStage'); if (!img) return;
      VIEWER.rot = (VIEWER.rot + deg + 360) % 360;
      const sideways = VIEWER.rot % 180 !== 0;
      // A sideways picture must fit the stage with its width and height swapped
      if (sideways && !stage.classList.contains('zoomed')) {
        const scale = Math.min(stage.clientHeight / img.offsetWidth, stage.clientWidth / img.offsetHeight, 1.6);
        img.style.transform = `rotate(${VIEWER.rot}deg) scale(${scale})`;
      } else {
        img.style.transform = `rotate(${VIEWER.rot}deg)`;
      }
    }
    function toggleViewerZoom(e) {
      const stage = document.getElementById('viewerStage'); if (!stage) return;
      const zoomed = stage.classList.toggle('zoomed');
      const btn = document.getElementById('viewerZoomBtn'); if (btn) btn.textContent = zoomed ? '🔍 Fit to screen' : '🔍 Zoom in';
      rotateViewer(0);
      if (zoomed && e) {
        const r = stage.getBoundingClientRect();
        stage.scrollLeft = ((e.clientX - r.left) / r.width) * stage.scrollWidth - r.width / 2;
        stage.scrollTop = ((e.clientY - r.top) / r.height) * stage.scrollHeight - r.height / 2;
      }
    }

    /** "2026-10-14" -> "Oct 14, 2026" without timezone shifting. */
    function fmtDate(ymd) {
      if (!ymd) return '—';
      const [y, m, d] = String(ymd).slice(0, 10).split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '—'; }
    function todayYmd() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }

    /* ============================= MODAL ============================= */
    function openModal(html, wide = false) {
      const box = document.getElementById('modalBox');
      box.classList.toggle('modal-wide', wide);
      box.innerHTML = '<button class="modal-close" onclick="closeModal()">✕</button>' + html;
      document.getElementById('modalRoot').classList.add('show');
    }
    function closeModal() { stopCamera(); document.getElementById('modalRoot').classList.remove('show'); const box = document.getElementById('modalBox'); box.innerHTML = ''; box.classList.remove('modal-wide'); }

    /* ============================= CAMERA ============================= */
    function stopCamera() {
      if (ST.camStream) { ST.camStream.getTracks().forEach(t => t.stop()); ST.camStream = null; }
      if (window._scanRAF) { cancelAnimationFrame(window._scanRAF); window._scanRAF = null; }
    }
    async function requestCamera(videoEl, hiRes = false) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast('Camera needs HTTPS (or localhost). Open the site over https://.', 'err'); return false;
      }
      try {
        // Paper photos need a high resolution to keep handwriting readable; QR scanning doesn't
        const video = hiRes ? { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 } } : { facingMode: 'environment' };
        const stream = await navigator.mediaDevices.getUserMedia({ video });
        ST.camStream = stream; videoEl.srcObject = stream; await videoEl.play(); return true;
      } catch (e) { toast('Camera permission denied or unavailable.', 'err'); return false; }
    }

    /* ============================= AUTH ============================= */
    function renderAuth() {
      const app = document.getElementById('app');
      if (ST.authView === 'verify') {
        app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="brand"><div class="mark">AE</div><div class="name">MTQ-ATTENDEASE</div></div>
      <h2 style="margin-bottom:4px;">Check your email</h2>
      <p style="color:var(--ink-400);font-size:13.5px;margin:4px 0 20px;line-height:1.6;">We sent a 6-digit code to <b style="color:var(--ink-900);">${esc(ST.verifyEmail)}</b>. Enter it below to activate your account. The code expires in 15 minutes.</p>
      <div id="authMsg"></div>
      <form onsubmit="return doVerify(event)">
        <div class="field"><label>Verification Code</label><input id="verifyCode" required inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" style="font-size:22px;letter-spacing:8px;text-align:center;"></div>
        <button class="btn btn-primary" type="submit">Verify &amp; Continue</button>
      </form>
      <div class="switch-line">Didn't get it? Check your spam folder, or <button class="link-btn" id="resendBtn" onclick="resendCode()">send a new code</button></div>
      <div class="switch-line" style="margin-top:6px;"><button class="link-btn" onclick="ST.authView='login';renderAuth()">← Back to log in</button></div>
    </div></div>`;
        setTimeout(() => { const el = document.getElementById('verifyCode'); if (el) el.focus(); }, 50);
        return;
      }
      if (ST.authView === 'login') {
        app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="brand"><div class="mark">AE</div><div class="name">MTQ-ATTENDEASE</div></div>
      <h2 style="margin-bottom:4px;">Welcome back</h2>
      <p style="color:var(--ink-400);font-size:13.5px;margin:4px 0 20px;">Sign in to your MTQ-ATTENDEASE account.</p>
      <div id="authMsg"></div>
      <form onsubmit="return doLogin(event)">
        <div class="field"><label>Email</label><input id="loginEmail" type="email" required placeholder="you@school.edu.ph"></div>
        <div class="field"><label>Password</label><div class="pw-wrap">
          <input id="loginPw" type="password" required placeholder="Enter password">
          <button type="button" onclick="togglePw('loginPw',this)">Show</button>
        </div></div>
        <button class="btn btn-primary" type="submit">Log In</button>
      </form>
      <div class="switch-line">New here? <button class="link-btn" onclick="ST.authView='register';renderAuth()">Create an account</button></div>
    </div></div>`;
      } else {
        app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="brand"><div class="mark">AE</div><div class="name">MTQ-ATTENDEASE</div></div>
      <h2 style="margin-bottom:4px;">Create your account</h2>
      <p style="color:var(--ink-400);font-size:13.5px;margin:4px 0 18px;">Register as a student or teacher.</p>
      <div id="authMsg"></div>
      <div class="tabs" style="margin-bottom:18px;">
        <button class="tab ${ST.authRole === 'student' ? 'active' : ''}" onclick="ST.authRole='student';renderAuth()">Student</button>
        <button class="tab ${ST.authRole === 'teacher' ? 'active' : ''}" onclick="ST.authRole='teacher';renderAuth()">Teacher</button>
      </div>
      <form onsubmit="return doRegister(event)">
        <div class="field"><label>Full Name</label><input id="regName" required placeholder="Juan Dela Cruz"></div>
        <div class="field"><label>${ST.authRole === 'student' ? 'Student ID' : 'Teacher ID'}</label><input id="regSchoolId" required placeholder="e.g. 2023-00123"></div>
        <div class="field"><label>Email</label><input id="regEmail" type="email" required placeholder="you@school.edu.ph"></div>
        ${ST.authRole === 'student' ? `
          <div class="field"><label>Course</label>${courseSelect('regCourse')}</div>
          <div class="row wrap">
            <div class="field" style="flex:1;"><label>Year Level</label>${yearSelect('regYear')}</div>
            <div class="field" style="flex:1;"><label>Section</label>${sectionSelect('regSection')}</div>
          </div>` : `
          <div class="field"><label>Department</label><input id="regDept" required placeholder="Information Technology Department"></div>`}
        <div class="field"><label>Password</label><div class="pw-wrap">
          <input id="regPw" type="password" required oninput="updatePwStrength()" placeholder="Create a password">
          <button type="button" onclick="togglePw('regPw',this)">Show</button>
        </div>
        <div class="pw-strength"><i id="pwBar" style="width:0%;background:#ddd;"></i></div>
        <div class="hint">${passwordPolicyText()}</div></div>
        <div class="field"><label>Confirm Password</label><div class="pw-wrap">
          <input id="regPw2" type="password" required placeholder="Re-enter password">
          <button type="button" onclick="togglePw('regPw2',this)">Show</button>
        </div></div>
        <button class="btn btn-primary" type="submit">Register</button>
      </form>
      <div class="switch-line">Already have an account? <button class="link-btn" onclick="ST.authView='login';renderAuth()">Log in</button></div>
    </div></div>`;
      }
    }
    function togglePw(id, btn) { const el = document.getElementById(id); const show = el.type === 'password'; el.type = show ? 'text' : 'password'; btn.textContent = show ? 'Hide' : 'Show'; }
    function updatePwStrength() {
      const pw = document.getElementById('regPw').value; const { score } = checkPasswordStrength(pw);
      const bar = document.getElementById('pwBar'); const colors = ['#e0665f', '#e0665f', '#E0A63B', '#E0A63B', '#3FB6AC', '#2E8B57'];
      bar.style.width = (score / 5 * 100) + '%'; bar.style.background = colors[score];
    }
    function authMsg(text, type = 'err') { document.getElementById('authMsg').innerHTML = `<div class="msg msg-${type === 'err' ? 'err' : 'ok'}">${esc(text)}</div>`; }

    async function doRegister(e) {
      e.preventDefault();
      const role = ST.authRole;
      const payload = {
        name: document.getElementById('regName').value.trim(),
        school_id: document.getElementById('regSchoolId').value.trim(),
        email: document.getElementById('regEmail').value.trim().toLowerCase(),
        password: document.getElementById('regPw').value,
        role,
      };
      const pw2 = document.getElementById('regPw2').value;
      if (payload.password !== pw2) { authMsg('Passwords do not match.'); return false; }
      if (role === 'student') {
        payload.course = document.getElementById('regCourse').value;
        payload.year_level = document.getElementById('regYear').value;
        if (!payload.course) { authMsg('Please choose your course.'); return false; }
        if (!payload.year_level) { authMsg('Please choose your year level.'); return false; }
        payload.section = document.getElementById('regSection').value;
        if (!SECTIONS.includes(payload.section)) { authMsg('Please choose your section (A, B, or C).'); return false; }
      } else {
        payload.department = document.getElementById('regDept').value.trim();
      }
      try {
        const res = await api('/register', { method: 'POST', body: JSON.stringify(payload) });
        showVerify(res.email || payload.email);
      } catch (err) {
        authMsg((err.data && err.data.message) || 'Could not register. Check your details.');
      }
      return false;
    }
    async function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPw').value;
      try {
        const data = await api('/login', { method: 'POST', body: JSON.stringify({ email, password }) });
        setToken(data.token);
        ST.user = data.user; ST.page = 'dashboard'; ST.activeClassId = null;
        await bootstrapData();
        render();
      } catch (err) {
        if (err.status === 403 && err.data && err.data.verification_required) { showVerify(err.data.email || email, err.data.message); return false; }
        authMsg((err.data && err.data.message) || 'Could not log in.');
      }
      return false;
    }

    /* ---- Email verification (6-digit code) ---- */
    function showVerify(email, message) {
      ST.authView = 'verify'; ST.verifyEmail = email; renderAuth();
      if (message) authMsg(message, 'ok');
    }
    async function doVerify(e) {
      e.preventDefault();
      const code = document.getElementById('verifyCode').value.trim();
      if (!/^\d{6}$/.test(code)) { authMsg('Enter the 6-digit code from your email.'); return false; }
      try {
        const data = await api('/email/verify', { method: 'POST', body: JSON.stringify({ email: ST.verifyEmail, code }) });
        setToken(data.token);
        ST.user = data.user; ST.page = 'dashboard'; ST.activeClassId = null; ST.authView = 'login';
        await bootstrapData();
        render(); toast('Email verified. Welcome!', 'ok');
      } catch (err) {
        if (err.status === 409) { ST.authView = 'login'; renderAuth(); authMsg(err.data.message, 'ok'); return false; }
        authMsg((err.data && err.data.message) || 'Could not verify the code.');
      }
      return false;
    }
    async function resendCode() {
      const btn = document.getElementById('resendBtn');
      try {
        const res = await api('/email/resend', { method: 'POST', body: JSON.stringify({ email: ST.verifyEmail }) });
        authMsg(res.message, 'ok');
        cooldownButton(btn, res.retry_after || 60, 'send a new code');
      } catch (err) { authMsg((err.data && err.data.message) || 'Could not send a new code.'); }
    }
    function cooldownButton(btn, secs, label) {
      if (!btn) return;
      btn.disabled = true;
      const tick = () => {
        if (!document.body.contains(btn)) return;
        if (secs <= 0) { btn.disabled = false; btn.textContent = label; return; }
        btn.textContent = `${label} (${secs}s)`; secs--; setTimeout(tick, 1000);
      };
      tick();
    }
    async function doLogout() {
      try { await api('/logout', { method: 'POST' }); } catch (e) { }
      setToken(null); ST.user = null; ST.authView = 'login'; ST.page = 'dashboard'; render();
    }

    /* ============================= BOOTSTRAP ============================= */
    async function bootstrapData() {
      try {
        const [classes, notifications] = await Promise.all([api('/classes'), api('/notifications')]);
        CACHE.classes = classes; CACHE.notifications = notifications;
        if (ST.user.role === 'student') {
          const [myAttendance, myAssessments] = await Promise.all([api('/my-attendance'), api('/my-assessments')]);
          CACHE.myAttendance = myAttendance; CACHE.myAssessments = myAssessments;
        }
      } catch (e) { apiErrorToast(e); }
    }
    async function tryRestoreSession() {
      if (!TOKEN) return;
      try {
        ST.user = await api('/me');
        await bootstrapData();
      } catch (e) { setToken(null); ST.user = null; }
    }

    /* ============================= SHELL / NAV ============================= */
    const STUDENT_NAV = [['dashboard', '⌂', 'Dashboard'], ['subjects', '📚', 'My Subjects'], ['scan', '▣', 'Scan QR'], ['attendance', '✓', 'Attendance'], ['assessments', '📝', 'Assessments'], ['notifications', '🔔', 'Notifications'], ['profile', '👤', 'Profile']];
    const TEACHER_NAV = [['dashboard', '⌂', 'Dashboard'], ['classes', '🏫', 'My Classes'], ['reports', '📊', 'Reports'], ['notifications', '🔔', 'Notifications'], ['profile', '👤', 'Profile']];
    function navFor() { return ST.user.role === 'student' ? STUDENT_NAV : TEACHER_NAV; }
    function pageTitle() { const f = navFor().find(n => n[0] === ST.page); return f ? f[2] : 'MTQ-ATTENDEASE'; }
    async function setPage(p) { ST.page = p; ST.sidebarOpen = false; ST.activeClassId = null; render(); await refreshForPage(); }
    function unreadCount() { return CACHE.notifications.filter(n => !n.read).length; }

    function render() {
      if (!ST.user) { renderAuth(); return; }
      const app = document.getElementById('app');
      const nav = navFor();
      app.innerHTML = `
  <div class="shell">
    ${ST.sidebarOpen ? `<div class="overlay" onclick="ST.sidebarOpen=false;render()"></div>` : ''}
    <div class="sidebar ${ST.sidebarOpen ? 'open' : ''}">
      <div class="brand"><div class="mark">AE</div><div class="name">MTQ-ATTENDEASE</div></div>
      ${nav.map(n => `<button class="nav-item ${ST.page === n[0] ? 'active' : ''}" onclick="setPage('${n[0]}')"><span class="ic">${n[1]}</span> ${n[2]}</button>`).join('')}
      <div class="sidebar-foot">
        <button class="nav-item" onclick="setPage('settings')"><span class="ic">⚙</span> Settings</button>
        <button class="nav-item" onclick="doLogout()"><span class="ic">⏻</span> Log Out</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="row" style="gap:12px;"><button class="hamburger" onclick="ST.sidebarOpen=true;render()">☰</button><div class="title">${esc(pageTitle())}</div></div>
        <div class="topbar-right">
          <button class="bell" onclick="setPage('notifications')">🔔${unreadCount() > 0 ? `<span class="dot">${unreadCount()}</span>` : ''}</button>
          <div class="avatar">${esc(ST.user.name.split(' ').map(w => w[0]).slice(0, 2).join(''))}</div>
        </div>
      </div>
      <div class="content" id="pageContent"><div class="loading">Loading…</div></div>
    </div>
  </div>
  <div class="bottom-nav">${nav.slice(0, 5).map(n => `<button class="${ST.page === n[0] ? 'active' : ''}" onclick="setPage('${n[0]}')"><span class="ic">${n[1]}</span>${n[2].split(' ')[0]}</button>`).join('')}</div>`;
      renderPage();
    }

    async function refreshForPage() {
      try {
        if (ST.page === 'notifications') { CACHE.notifications = await api('/notifications'); await api('/notifications/mark-read', { method: 'POST' }); }
        else if (ST.page === 'classes' || ST.page === 'dashboard') { CACHE.classes = await api('/classes'); }
        else if (ST.page === 'attendance' && ST.user.role === 'student') { CACHE.myAttendance = await api('/my-attendance'); }
        else if (ST.page === 'assessments' && ST.user.role === 'student') { CACHE.myAssessments = await api('/my-assessments'); }
        else if (ST.page === 'dashboard' && ST.user.role === 'student') { CACHE.myAttendance = await api('/my-attendance'); }
      } catch (e) { /* non-fatal */ }
      renderPage();
    }

    function renderPage() {
      const c = document.getElementById('pageContent'); if (!c) return;
      const role = ST.user.role;
      const map = role === 'student' ? {
        dashboard: studentDashboard, subjects: studentSubjects, scan: studentScan, attendance: studentAttendance,
        assessments: studentAssessments, notifications: pageNotifications, profile: pageProfile, settings: pageSettings
      } : {
        dashboard: teacherDashboard, classes: teacherClasses, reports: teacherReports,
        notifications: pageNotifications, profile: pageProfile, settings: pageSettings
      };
      c.innerHTML = (map[ST.page] || map.dashboard)();
    }

    /* ============================= STUDENT: DASHBOARD ============================= */
    function studentDashboard() {
      const u = ST.user;
      const classes = CACHE.classes.filter(c => c.status === 'approved');
      const recent = (CACHE.myAttendance || []).filter(r => Number(r.stage) === 1).slice(0, 5);
      return `
  <div class="grid grid-4" style="margin-bottom:20px;">
    <div class="card stat"><div class="num">${classes.length}</div><div class="lbl">Enrolled Subjects</div></div>
    <div class="card stat"><div class="num">${CACHE.myAttendance.length}</div><div class="lbl">Attendance Records</div></div>
    <div class="card stat"><div class="num">${CACHE.myAssessments.filter(a => a.my_submission).length}</div><div class="lbl">Submissions Made</div></div>
    <div class="card stat"><div class="num">${unreadCount()}</div><div class="lbl">Unread Notifications</div></div>
  </div>
  <div class="grid grid-2">
    <div class="card"><div class="section-title"><h3>My Subjects</h3><button class="btn btn-outline btn-sm" onclick="setPage('subjects')">Manage</button></div>

    function studentScan() {
      return `<div class="card" style="max-width:520px;margin:0 auto;">
    <h3 style="margin-bottom:6px;">Scan QR Code</h3>
    <p style="color:var(--ink-400);font-size:13.5px;margin-bottom:16px;">Point your camera at your teacher's attendance QR code.</p>
    <div><video id="scanVideo" playsinline muted></video></div>
    <div id="scanStatus" class="scan-status" style="background:var(--teal-100);color:var(--teal-700);">Tap "Start Scanning" to begin.</div>
    <div class="row" style="margin-top:12px;justify-content:center;gap:10px;">
      <button class="btn btn-primary" style="width:auto;" onclick="startStudentScan()">Start Scanning</button>
      <button class="btn btn-outline" style="width:auto;" onclick="stopCamera();document.getElementById('scanStatus').textContent='Stopped.'">Stop</button>
    </div></div>`;
    }
    async function startStudentScan() {
      const video = document.getElementById('scanVideo'); const statusEl = document.getElementById('scanStatus');
      stopCamera();
      if (!await requestCamera(video)) return;
      statusEl.textContent = 'Scanning...'; statusEl.style.background = 'var(--teal-100)'; statusEl.style.color = 'var(--teal-700)';
      const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
      let busy = false;
      function tick() {
        if (!ST.camStream) return;
        if (!busy && video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(img.data, img.width, img.height);
          if (code) { busy = true; handleScannedPayload(code.data, statusEl); return; }
        }
        window._scanRAF = requestAnimationFrame(tick);
      }
      window._scanRAF = requestAnimationFrame(tick);
    }
    function setScanStatus(el, text, type) {
      el.textContent = text;
      const colors = { ok: ['var(--ok-bg)', 'var(--ok)'], err: ['var(--danger-bg)', 'var(--danger)'], info: ['var(--teal-100)', 'var(--teal-700)'] };
      el.style.background = colors[type][0]; el.style.color = colors[type][1];
    }
    async function handleScannedPayload(raw, statusEl) {
      let payload;
      try { payload = JSON.parse(raw); } catch (e) { setScanStatus(statusEl, 'Invalid QR Code.', 'err'); restartScanSoon(); return; }

      if (payload.t === 'attendance') {
        try {
          const res = await api('/attendance/scan', { method: 'POST', body: JSON.stringify({ class_id: payload.classId, stage: payload.stage, token: payload.token }) });
          stopCamera();
          setScanStatus(statusEl, res.message, 'ok'); toast('Attendance recorded!', 'ok');
          CACHE.myAttendance = await api('/my-attendance');
        } catch (err) {
          setScanStatus(statusEl, (err.data && err.data.message) || `Could not record attendance (${err.status ? 'server error ' + err.status : 'no connection'}).`, 'err');
        }
        return;
      }
      if (payload.t === 'assessment') {
        setScanStatus(statusEl, 'Assessments no longer use QR codes. Open the subject in My Subjects and tap "Submit Photo".', 'err');
        restartScanSoon(); return;
      }
      setScanStatus(statusEl, 'Invalid QR Code.', 'err'); restartScanSoon();
    }
    function restartScanSoon() { setTimeout(() => { if (document.getElementById('scanVideo')) startStudentScan(); }, 1600); }

    function capturePhoto() {
      const video = document.getElementById('capVideo'); const canvas = document.getElementById('capCanvas');
      if (!ST.camStream || !video.videoWidth) { toast('The camera is not ready yet. Allow camera access and try again.', 'err'); return; }
      const scale = Math.min(1, 2000 / Math.max(video.videoWidth, video.videoHeight)); // keeps the upload well under the size limit
      canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('capPreview').src = dataUrl; document.getElementById('capPreview').style.display = 'block';
